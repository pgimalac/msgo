# This workflow builds Microsoft Go for multiple platforms
# following the steps defined in eng/doc/DeveloperGuide.md

name: "Build Microsoft Go"

on:
  push:
  # workflow_dispatch:
  #   inputs:
  #     bootstrap_go_version:
  #       description: 'Bootstrap Go version to use for building (e.g., 1.25.0)'
  #       required: true
  #       type: string
  #     publish_artifacts:
  #       description: 'Publish artifacts publicly'
  #       required: false
  #       default: false
  #       type: boolean

env:
  # Used to identify build artifacts
  BUILD_ID: ${{ github.run_number }}

jobs:
  build:
    name: Build (${{ matrix.target_os }}-${{ matrix.target_arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64 - native build
          - runner: ubuntu-latest
            target_os: linux
            target_arch: amd64
            archive_ext: tar.gz
            shell: bash

          # Linux arm64 - native build on ARM runner
          - runner: ubuntu-24.04-arm
            target_os: linux
            target_arch: arm64
            archive_ext: tar.gz
            shell: bash

          # Windows amd64 - native build
          - runner: windows-latest
            target_os: windows
            target_arch: amd64
            archive_ext: zip
            shell: pwsh

          # Linux armv6l - cross-compile from linux-amd64
          - runner: ubuntu-latest
            target_os: linux
            target_arch: arm
            display_arch: armv6l
            archive_ext: tar.gz
            shell: bash
            cross_compile: true

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
